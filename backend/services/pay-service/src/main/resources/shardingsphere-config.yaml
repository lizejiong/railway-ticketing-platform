dataSources:
  ds_0:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://127.0.0.1:3306/12306_pay_0?useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 12306-root
  ds_1:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://127.0.0.1:3306/12306_pay_1?useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 12306-root

rules:
  - !SHARDING
    tables:
      t_pay:
        actualDataNodes: ds_${0..1}.t_pay_${0..31}
        databaseStrategy:
          complex:
            shardingColumns: order_sn,pay_sn
            shardingAlgorithmName: pay_database_complex_mod
        tableStrategy:
          complex:
            shardingColumns: order_sn,pay_sn
            shardingAlgorithmName: pay_table_complex_mod
    shardingAlgorithms:
      pay_database_complex_mod:
        type: CLASS_BASED
        props:
          strategy: complex
          algorithmClassName: com.lzj.railway.pay.dao.algorithm.PayDatabaseComplexShardingAlgorithm
          sharding-count: 32
          table-sharding-count: 16
      pay_table_complex_mod:
        type: CLASS_BASED
        props:
          strategy: complex
          algorithmClassName: com.lzj.railway.pay.dao.algorithm.PayTableComplexShardingAlgorithm
          sharding-count: 32
  - !SINGLE
    defaultDataSource: ds_0

props:
  sql-show: true
