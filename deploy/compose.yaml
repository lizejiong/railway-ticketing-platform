services:
  redis:
    image: redis:7.4.2-alpine
    container_name: 12306-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in deploy/.env}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in deploy/.env}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  nacos:
    image: nacos/nacos-server:v2.5.4
    container_name: 12306-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?Set NACOS_AUTH_TOKEN in deploy/.env}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:?Set NACOS_AUTH_IDENTITY_KEY in deploy/.env}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:?Set NACOS_AUTH_IDENTITY_VALUE in deploy/.env}
      JVM_XMS: 256m
      JVM_XMX: 256m
    ports:
      - "${NACOS_PORT:-8848}:8848"
      - "${NACOS_GRPC_PORT:-9848}:9848"
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8848/nacos/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.2
    container_name: 12306-rocketmq-namesrv
    restart: unless-stopped
    command: sh mqnamesrv
    ports:
      - "${ROCKETMQ_NAMESRV_PORT:-9876}:9876"
    volumes:
      - rocketmq-namesrv-logs:/home/rocketmq/logs

  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    container_name: 12306-rocketmq-broker
    restart: unless-stopped
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/rocketmq-5.3.2/conf/broker.conf
    depends_on:
      - rocketmq-namesrv
    ports:
      - "${ROCKETMQ_BROKER_VIP_PORT:-10909}:10909"
      - "${ROCKETMQ_BROKER_PORT:-10911}:10911"
      - "${ROCKETMQ_BROKER_HA_PORT:-10912}:10912"
    volumes:
      - type: bind
        source: ./rocketmq/broker.conf
        target: /home/rocketmq/rocketmq-5.3.2/conf/broker.conf
        read_only: true
      - rocketmq-broker-logs:/home/rocketmq/logs
      - rocketmq-broker-store:/home/rocketmq/store

  mysql:
    image: mysql:8.0.36
    container_name: 12306-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in deploy/.env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - type: bind
        source: ./mysql/init/00-create-databases.sql
        target: /docker-entrypoint-initdb.d/00-create-databases.sql
        read_only: true
      - type: bind
        source: ${SQL_ASSET_ROOT:?Set SQL_ASSET_ROOT in deploy/.env}/db/12306-springcloud-user.sql
        target: /docker-entrypoint-initdb.d/10-user-schema.source
        read_only: true
      - type: bind
        source: ${SQL_ASSET_ROOT:?Set SQL_ASSET_ROOT in deploy/.env}/db/12306-springcloud-order.sql
        target: /docker-entrypoint-initdb.d/20-order-schema.source
        read_only: true
      - type: bind
        source: ${SQL_ASSET_ROOT:?Set SQL_ASSET_ROOT in deploy/.env}/db/12306-springcloud-pay.sql
        target: /docker-entrypoint-initdb.d/30-pay-schema.source
        read_only: true
      - type: bind
        source: ${SQL_ASSET_ROOT:?Set SQL_ASSET_ROOT in deploy/.env}/db/12306-springcloud-ticket.sql
        target: /docker-entrypoint-initdb.d/40-ticket-schema.source
        read_only: true
      - type: bind
        source: ${SQL_ASSET_ROOT:?Set SQL_ASSET_ROOT in deploy/.env}/data/12306-springcloud-ticket.sql
        target: /docker-entrypoint-initdb.d/50-ticket-data.source
        read_only: true
      - type: bind
        source: ${SQL_ASSET_ROOT:?Set SQL_ASSET_ROOT in deploy/.env}/data/12306-springcloud-user.sql
        target: /docker-entrypoint-initdb.d/60-user-data.source
        read_only: true
      - type: bind
        source: ./mysql/init/90-import-provided-sql.sh
        target: /docker-entrypoint-initdb.d/90-import-provided-sql.sh
        read_only: true
      - type: bind
        source: ./mysql/migrations/001-add-refund-order-item-id.sql
        target: /docker-entrypoint-initdb.d/91-add-refund-order-item-id.sql
        read_only: true
      - type: bind
        source: ./mysql/migrations/002-add-ticket-order-sn.sql
        target: /docker-entrypoint-initdb.d/92-add-ticket-order-sn.sql
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  redis-data:
  nacos-data:
  nacos-logs:
  rocketmq-namesrv-logs:
  rocketmq-broker-logs:
  rocketmq-broker-store:
  mysql-data:
